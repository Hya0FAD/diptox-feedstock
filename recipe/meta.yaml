{% set name = "diptox" %}
{% set version = "1.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 9f2ad666aeaa6ffbff2037228b06ce95c9eb40c2dbb7f1168a7371c559ad22d9

build:
  entry_points:
    - diptox = diptox.command_line:main
    - diptox-gui = diptox.cli:run_gui
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}.*
    - setuptools >=68
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - requests
    - pandas
    - rdkit >=2023.3
    - tqdm
    - scipy
    - openpyxl
    - nicegui >=3.16,<4

test:
  imports:
    - diptox
    - diptox.gui
    - diptox.command_line
  commands:
    - pip check
    - diptox --help
    - diptox schema
  requires:
    - pip
    - python {{ python_min }}.*

about:
  home: https://pypi.org/project/diptox/
  summary: Data Integration and Processing for Computational Toxicology
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Hya0FAD
